IRE continua sem derrotas: 7 vitórias em 9 jogos, com 21 pontos.`,`Ao todo, 24 guildas já pontuaram ou entraram em campo. A temporada vai até à Rodada 25.`],featured:!1,example:!1},{id:`rodada-20-comecou`,title:`Rodada 20: que vença o melhor`,date:`2026-09-30`,category:`Liga`,image:`/assets/league/rodadas/r20-inicio.webp`,excerpt:`Começou a Rodada 20 da Liga Aliança. Faltam cinco rodadas para o fim da Temporada 1.`,body:[`A Rodada 20 da Liga Aliança já está em andamento.`,`Depois de 19 rodadas de muito esforço, a disputa entra na reta final: a temporada termina na Rodada 25.`],featured:!1,example:!1},{id:`fim-rodada-19`,title:`Fim da Rodada 19: bom trabalho a todos`,date:`2026-09-29`,category:`Liga`,image:`/assets/league/rodadas/r19-fim.webp`,excerpt:`Mais uma rodada concluída. 19 rodadas de esforço, mais união entre os membros e mais aprendizado em cada jogo.`,body:[`A Rodada 19 da Liga Aliança terminou.`,`A união continua e os resultados também. Até à próxima rodada!`],featured:!1,example:!1},{id:`mercado-nova-tabela`,title:`Mercado da Aliança atualiza a tabela de preços`,date:`2026-09-28`,category:`Mercado`,image:`/assets/market/tabela-de-precos.webp`,excerpt:`Novos preços para diamantes, pacotes de nível, assinaturas, Passe Booyah e Trilha da Evolução — com o mesmo compromisso de qualidade e segurança.`,body:[`O Mercado da Aliança atualizou a sua tabela de preços.`,`A administração mantém o compromisso: qualidade, segurança e o melhor atendimento para cada cliente.`,`Consulta todos os preços na página do Mercado e faz o teu pedido pelo WhatsApp.`],featured:!1,example:!1},{id:`programa-de-selos`,title:`Nasce o Programa de Selos de Clientes`,date:`2026-08-05`,category:`Mercado`,image:`/assets/market/programa-de-selos.webp`,excerpt:`Compre, evolua, colecione e seja reconhecido: a cada compra no Mercado, o cliente sobe de nível.`,body:[`O Mercado da Aliança lançou o Programa de Selos de Clientes.`,`A primeira compra dá o selo Cliente Novo (nível 1), a segunda o selo Cliente Ativo (nível 2) e a terceira o selo Cliente Frequente (nível 3). Há mais níveis por desbloquear.`,`Cada selo é entregue no grupo, junto com a mensagem de parabéns da Aliança.`],featured:!1,example:!1}],nr={intro:`Ao entrar na Aliança, cada membro e cada guilda aceita este regulamento. As regras existem para proteger a comunidade e garantir uma competição justa.`,sections:[{id:`conduta`,title:`Conduta geral`,rules:[`Respeito entre todos os membros, guildas e administração.`,`Proibidos insultos, discriminação, ameaças ou assédio.`,`Proibida a partilha de conteúdo impróprio, ofensivo ou ilegal nos grupos.`,`Discussões entre guildas resolvem-se em privado ou com a administração — nunca no grupo geral.`]},{id:`fair-play`,title:`Fair Play`,rules:[`Zero tolerância a hacks, scripts, macros ou programas de terceiros.`,`Proibido usar emuladores em competições oficiais, salvo indicação em contrário.`,`Proibido combinar resultados, entregar quedas ou fazer “teaming” com outras equipas.`,`Bugs do jogo não devem ser explorados intencionalmente.`]},{id:`guildas`,title:`Guildas filiadas`,rules:[`Cada guilda tem um líder responsável perante a Aliança.`,`O líder mantém a administração informada sobre mudanças importantes na guilda.`,`As guildas mantêm a sua identidade, mas representam também a Aliança.`,`Transferências de jogadores entre guildas durante uma temporada da Liga seguem as regras da Liga.`]},{id:`grupos`,title:`Grupos do WhatsApp`,rules:[`Cada grupo tem um tema — respeita-o.`,`Proibido spam, correntes e publicidade sem autorização.`,`Links externos só com autorização da administração.`,`Anúncios oficiais são feitos apenas pela administração.`]},{id:`mercado`,title:`Mercado`,rules:[`Negócios apenas no canal oficial do Mercado.`,`Burlas resultam em expulsão permanente.`,`Proibidos negócios que violem os Termos de Serviço do Free Fire.`]},{id:`sancoes`,title:`Sanções`,rules:[`Advertência — para infrações leves.`,`Suspensão temporária dos grupos e competições.`,`Expulsão da Aliança — para infrações graves ou repetidas.`,`A administração decide as sanções; a decisão do Fundador é final.`]}],updated:`2026-10-02`,draft:!0,draftNote:`Regulamento em revisão pela administração. As regras da Liga Aliança, na página da Liga, são as oficiais.`},rr=[{id:`comunidade`,title:`Comunidade`,items:[{id:`logo`,title:`Brasão da ANGA`,image:`/assets/branding/anga-logo.webp`},{id:`salao-adms`,title:`Salão dos ADMS`,image:`/assets/community/salao-dos-adms.webp`},{id:`salao-membros`,title:`Salão de Membros`,image:`/assets/community/salao-de-membros.webp`},{id:`inauguracao`,title:`Inauguração — “Hoje nasce a Aliança”`,image:`/assets/community/inauguracao.webp`},{id:`whatsapp`,title:`A comunidade no WhatsApp — 1709 membros, 32 grupos`,image:`/assets/community/comunidade-whatsapp.webp`}]},{id:`mercado`,title:`Mercado da Aliança`,items:[{id:`mercado-logo`,title:`Mercado da Aliança`,image:`/assets/branding/mercado-logo.webp`},{id:`programa`,title:`Programa de Selos de Clientes`,image:`/assets/market/programa-de-selos.webp`},{id:`precos`,title:`Tabela de preços (28/09/2026)`,image:`/assets/market/tabela-de-precos.webp`},{id:`selo-fernando-3`,title:`Selo nível 3 — Fernando`,image:`/assets/market/selos/selo-fernando-n3.webp`},{id:`selo-laurifreezy-3`,title:`Selo nível 3 — LauriFreezy`,image:`/assets/market/selos/selo-laurifreezy-n3.webp`},{id:`selo-fernando-2`,title:`Selo nível 2 — Fernando`,image:`/assets/market/selos/selo-fernando-n2.webp`},{id:`selo-laurifreezy-2`,title:`Selo nível 2 — LauriFreezy`,image:`/assets/market/selos/selo-laurifreezy-n2.webp`},{id:`selo-fernando-1`,title:`Selo nível 1 — Fernando`,image:`/assets/market/selos/selo-fernando-n1.webp`},{id:`selo-luis-1`,title:`Selo nível 1 — Luís`,image:`/assets/market/selos/selo-luis-n1.webp`},{id:`selo-delcio-1`,title:`Selo nível 1 — Délcio`,image:`/assets/market/selos/selo-delcio-n1.webp`},{id:`vira-carta`,title:`Diamantes do Mercado em ação: conjunto do Vira-Carta`,image:`/assets/market/provas/vir
