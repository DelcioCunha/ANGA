# Publica o website no GitHub Pages sempre que houver um push para a branch main.
# Valida o conteúdo, gera a pasta site/ e publica-a como raiz do website.
# Ativar uma vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Instalar dependências
        working-directory: website
        run: npm ci

      - name: Validar conteúdo e gerar site/
        working-directory: website
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
